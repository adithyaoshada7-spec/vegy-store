<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#559938"/>
      <stop offset="100%" stop-color="#2d6a1d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#d48b06"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM -->
  <g transform="translate(10, 8)" filter="url(#subtleShadow)">
    <!-- Sun / Circle background -->
    <circle cx="42" cy="42" r="38" fill="#f4faee" stroke="#d5e8c8" stroke-width="2"/>
    
    <!-- Golden Paddy Stalks (Left arch) -->
    <path d="M 38 72 C 32 60 22 45 25 28 C 26 22 30 18 34 20 C 37 22 35 28 32 34 C 29 40 33 52 38 72 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Paddy grains -->
    <ellipse cx="23" cy="27" rx="3.5" ry="6" transform="rotate(-30 23 27)" fill="url(#goldGrad)"/>
    <ellipse cx="20" cy="38" rx="3.5" ry="6" transform="rotate(-40 20 38)" fill="url(#goldGrad)"/>
    <ellipse cx="21" cy="49" rx="3.5" ry="6" transform="rotate(-45 21 49)" fill="url(#goldGrad)"/>
    <ellipse cx="26" cy="59" rx="3.2" ry="5.5" transform="rotate(-35 26 59)" fill="url(#goldGrad)"/>

    <!-- Organic Green Leaves (Right swoosh) -->
    <path d="M 38 72 C 40 54 48 36 62 26 C 65 24 67 26 66 29 C 63 38 54 48 44 56 C 41 62 39 67 38 72 Z" fill="url(#leafGrad)"/>
    <!-- Central lush leaf -->
    <path d="M 40 68 C 39 52 47 38 58 32 C 60 44 52 58 40 68 Z" fill="#6db846"/>
    <!-- Small budding leaf -->
    <path d="M 41 50 C 43 42 50 38 54 39 C 53 45 48 49 41 50 Z" fill="#4a7c34"/>
    
    <!-- Sprout stem -->
    <path d="M 38 72 Q 37 60 40 48" stroke="#2d6a1d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- BRAND TEXT -->
  <!-- Main Brand Name -->
  <text x="106" y="52" font-family="'Public Sans', 'Segoe UI', Montserrat, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="1.5" fill="#2d5e1e">
    RANKETHA
  </text>
  
  <!-- Secondary Brand Accent -->
  <text x="328" y="52" font-family="'Public Sans', 'Segoe UI', Montserrat, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="1" fill="#d48b06">
    ORGANICS
  </text>

  <!-- Tagline / Subtitle -->
  <rect x="108" y="62" width="418" height="2" fill="url(#goldGrad)" opacity="0.6"/>
  
  <text x="108" y="78" font-family="'Public Sans', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" letter-spacing="4.2" fill="#4a7c34">
    ORGANIC FOODS &amp; TRADITIONAL RICE
  </text>
  <text x="450" y="78" font-family="'Public Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" letter-spacing="1.5" fill="#d48b06">
    SRI LANKA
  </text>
</svg>
